<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi-Cam · Registry</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070709;--surface:#0d0d12;--card:#111118;--border:#1c1c28;
    --accent:#00ff88;--accent2:#0066ff;--red:#ff3344;--yellow:#ffbb00;
    --text:#e0e0e8;--muted:#444455;--font:'JetBrains Mono',monospace;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}

  /* ── Header ── */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 28px;border-bottom:1px solid var(--border);
    background:var(--surface);position:sticky;top:0;z-index:50;
    backdrop-filter:blur(12px);
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{font-size:24px}
  .logo-text{font-size:16px;font-weight:700;letter-spacing:.15em;color:var(--accent)}
  .logo-sub{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:2px}
  .header-actions{display:flex;gap:10px;align-items:center}
  #live-count{
    font-size:10px;letter-spacing:.12em;color:var(--accent);
    background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);
    padding:5px 12px;border-radius:20px;
  }

  /* ── Main ── */
  main{max-width:960px;margin:0 auto;padding:28px 20px}

  /* ── Section title ── */
  .section-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;
  }
  .section-title{
    font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .section-title::before{
    content:'';width:3px;height:14px;background:var(--accent);border-radius:2px;
  }

  /* ── Camera grid ── */
  #cam-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;
    margin-bottom:40px;
  }

  .cam-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:18px 20px;cursor:pointer;
    transition:border-color .2s,transform .15s,box-shadow .2s;
    position:relative;overflow:hidden;
  }
  .cam-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(0,255,136,.08);
  }
  .cam-card.offline{ opacity:.55 }
  .cam-card.offline:hover{ border-color:var(--border); box-shadow:none; transform:none }

  .cam-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .cam-icon{font-size:28px}
  .cam-status{
    font-size:9px;letter-spacing:.15em;padding:4px 10px;border-radius:20px;
    font-weight:700;display:flex;align-items:center;gap:5px;
  }
  .cam-status.online{
    background:rgba(0,255,136,.1);color:var(--accent);border:1px solid rgba(0,255,136,.25);
  }
  .cam-status.offline{
    background:rgba(68,68,85,.15);color:var(--muted);border:1px solid var(--border);
  }
  .status-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .status-dot.pulse{animation:pulse-dot 1.5s ease-in-out infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

  .cam-name{font-size:15px;font-weight:700;letter-spacing:.05em;margin-bottom:6px}
  .cam-meta{font-size:9px;color:var(--muted);letter-spacing:.1em;line-height:1.9}
  .cam-meta span{color:#333344}

  .cam-card-actions{display:flex;gap:8px;margin-top:14px}
  .btn-sm{
    flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text);font-family:var(--font);
    font-size:9px;letter-spacing:.12em;cursor:pointer;transition:all .15s;
    text-align:center;text-decoration:none;display:flex;align-items:center;
    justify-content:center;gap:5px;
  }
  .btn-sm:hover{background:rgba(255,255,255,.04)}
  .btn-sm.primary{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.3);color:var(--accent)}
  .btn-sm.primary:hover{background:rgba(0,255,136,.18)}
  .btn-sm.danger{color:var(--red);border-color:rgba(255,51,68,.2)}
  .btn-sm.danger:hover{background:rgba(255,51,68,.08)}

  /* Glow line top on online */
  .cam-card.online::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.6;
  }

  /* ── Empty state ── */
  #empty{
    text-align:center;padding:60px 20px;color:var(--muted);
    font-size:12px;letter-spacing:.1em;line-height:2.2;
    display:none;
  }
  #empty .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}

  /* ── Add camera CTA ── */
  .add-card{
    background:transparent;border:1px dashed var(--border);border-radius:10px;
    padding:28px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;cursor:default;opacity:.5;
    font-size:11px;letter-spacing:.1em;color:var(--muted);
  }

  /* ── QR Scanner modal ── */
  #qr-modal{
    position:fixed;inset:0;z-index:200;background:rgba(7,7,9,.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  }
  #qr-modal.show{display:flex}
  #qr-title{font-size:14px;font-weight:700;letter-spacing:.15em;color:var(--accent)}
  #qr-sub{font-size:10px;color:var(--muted);letter-spacing:.12em}
  #qr-wrap{
    position:relative;width:280px;height:280px;border-radius:12px;overflow:hidden;
    border:2px solid var(--accent);box-shadow:0 0 40px rgba(0,255,136,.2);
  }
  #qr-video{width:100%;height:100%;object-fit:cover}
  #qr-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #qr-scan-line{
    position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:scan-anim 2s ease-in-out infinite;top:0;
  }
  @keyframes scan-anim{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
  #qr-result{
    font-size:12px;color:var(--accent);letter-spacing:.1em;
    background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);
    padding:10px 20px;border-radius:6px;display:none;
  }
  #qr-result.show{display:block}
  #qr-close{
    padding:10px 24px;border:1px solid var(--border);border-radius:6px;
    background:transparent;color:var(--muted);font-family:var(--font);
    font-size:11px;letter-spacing:.15em;cursor:pointer;
  }
  #qr-close:hover{color:var(--text)}

  /* ── Rename modal ── */
  #rename-modal{
    position:fixed;inset:0;z-index:200;background:rgba(7,7,9,.92);
    display:none;align-items:center;justify-content:center;
  }
  #rename-modal.show{display:flex}
  .modal-box{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:28px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;
  }
  .modal-title{font-size:13px;font-weight:700;letter-spacing:.12em}
  .modal-input{
    width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:12px 14px;font-family:var(--font);font-size:14px;
    color:var(--text);outline:none;
  }
  .modal-input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:10px}
  .modal-btn{
    flex:1;padding:11px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text);font-family:var(--font);
    font-size:11px;letter-spacing:.12em;cursor:pointer;
  }
  .modal-btn.confirm{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

  /* ── Toast ── */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
    background:rgba(0,0,0,.95);border:1px solid var(--border);
    padding:10px 20px;border-radius:6px;font-size:11px;opacity:0;
    transition:all .25s;white-space:nowrap;z-index:300;pointer-events:none;
    letter-spacing:.08em;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── Responsive ── */
  @media(max-width:500px){
    header{padding:14px 16px}
    main{padding:18px 12px}
    #cam-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📷</div>
    <div>
      <div class="logo-text">WIFI-CAM</div>
      <div class="logo-sub">REGISTRY · DASHBOARD</div>
    </div>
  </div>
  <div class="header-actions">
    <div id="live-count">0 ao vivo</div>
    <button class="btn-sm" id="qr-scan-btn" style="width:auto;padding:7px 14px">
      📷 Escanear QR
    </button>
  </div>
</header>

<main>
  <div class="section-header">
    <div class="section-title">Câmeras registradas</div>
    <div style="font-size:9px;color:var(--muted);letter-spacing:.1em" id="cam-count">–</div>
  </div>

  <div id="cam-grid">
    <div class="add-card">
      <div style="font-size:28px">➕</div>
      <div>Abra camera.html no celular para adicionar</div>
    </div>
  </div>

  <div id="empty">
    <div class="empty-icon">📡</div>
    Nenhuma câmera registrada ainda.<br>
    Abra <b style="color:var(--text)">/camera.html</b> no celular<br>
    ou escaneie um QR Code.
  </div>
</main>

<!-- QR Scanner Modal -->
<div id="qr-modal">
  <div id="qr-title">ESCANEAR QR CODE</div>
  <div id="qr-sub">Aponte para o QR exibido na câmera</div>
  <div id="qr-wrap">
    <video id="qr-video" autoplay playsinline muted></video>
    <canvas id="qr-canvas"></canvas>
    <div id="qr-scan-line"></div>
  </div>
  <div id="qr-result"></div>
  <button id="qr-close">✕ FECHAR</button>
</div>

<!-- Rename Modal -->
<div id="rename-modal">
  <div class="modal-box">
    <div class="modal-title">✏️ Renomear câmera</div>
    <input class="modal-input" id="rename-input" maxlength="32" placeholder="Nome da câmera">
    <div class="modal-actions">
      <button class="modal-btn" id="rename-cancel">CANCELAR</button>
      <button class="modal-btn confirm" id="rename-confirm">SALVAR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
let cameras = [];
let renameTarget = null;

// ── Socket (live registry updates) ───────────────────────────────────────────
const socket = io();
socket.on('registry-updated', (cams) => { cameras = cams; renderGrid(); });

// ── API ───────────────────────────────────────────────────────────────────────
async function fetchCameras() {
  const res = await fetch('/api/cameras');
  cameras = await res.json();
  renderGrid();
}

async function deleteCamera(id) {
  await fetch(`/api/cameras/${id}`, { method: 'DELETE' });
  cameras = cameras.filter(c => c.id !== id);
  renderGrid();
  toast('Câmera removida');
}

async function renameCamera(id, name) {
  const res = await fetch(`/api/cameras/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const updated = await res.json();
  cameras = cameras.map(c => c.id === id ? updated : c);
  renderGrid();
  toast('Nome atualizado ✓');
}

// ── Render ────────────────────────────────────────────────────────────────────
function timeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60)   return `${s}s atrás`;
  if (s < 3600) return `${Math.floor(s/60)}min atrás`;
  if (s < 86400)return `${Math.floor(s/3600)}h atrás`;
  return `${Math.floor(s/86400)}d atrás`;
}

function renderGrid() {
  const grid = document.getElementById('cam-grid');
  const onlineCount = cameras.filter(c => c.online).length;

  document.getElementById('live-count').textContent = `${onlineCount} ao vivo`;
  document.getElementById('cam-count').textContent  = `${cameras.length} câmera${cameras.length !== 1 ? 's' : ''}`;

  if (cameras.length === 0) {
    grid.innerHTML = `<div class="add-card"><div style="font-size:28px">➕</div><div>Abra camera.html no celular para adicionar</div></div>`;
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  grid.innerHTML = cameras.map(cam => {
    const online = cam.online;
    const statusLabel = online ? 'ONLINE' : 'OFFLINE';
    const dotClass    = online ? 'status-dot pulse' : 'status-dot';
    return `
    <div class="cam-card ${online ? 'online' : 'offline'}">
      <div class="cam-card-top">
        <div class="cam-icon">${online ? '📷' : '📵'}</div>
        <div class="cam-status ${online ? 'online' : 'offline'}">
          <div class="${dotClass}"></div>${statusLabel}
        </div>
      </div>
      <div class="cam-name">${escHtml(cam.name)}</div>
      <div class="cam-meta">
        SALA <span>·</span> ${escHtml(cam.roomId)}<br>
        ID <span>·</span> ${cam.id.substring(0,8)}…<br>
        ${online ? '🟢 AO VIVO' : '⏱ ' + timeAgo(cam.lastSeen)}
      </div>
      <div class="cam-card-actions">
        ${online
          ? `<a class="btn-sm primary" href="/viewer.html?room=${encodeURIComponent(cam.roomId)}">▶ ASSISTIR</a>`
          : `<div class="btn-sm" style="opacity:.35;cursor:not-allowed">▶ OFFLINE</div>`
        }
        <button class="btn-sm" onclick="openRename('${cam.id}','${escHtml(cam.name)}')">✏️</button>
        <button class="btn-sm danger" onclick="confirmDelete('${cam.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

function confirmDelete(id) {
  if (confirm('Remover esta câmera do registry?')) deleteCamera(id);
}

// ── Rename modal ──────────────────────────────────────────────────────────────
function openRename(id, currentName) {
  renameTarget = id;
  document.getElementById('rename-input').value = currentName;
  document.getElementById('rename-modal').classList.add('show');
  document.getElementById('rename-input').focus();
}

document.getElementById('rename-cancel').addEventListener('click', () => {
  document.getElementById('rename-modal').classList.remove('show');
});

document.getElementById('rename-confirm').addEventListener('click', () => {
  const name = document.getElementById('rename-input').value.trim();
  if (!name) return;
  renameCamera(renameTarget, name);
  document.getElementById('rename-modal').classList.remove('show');
});

// ── QR Scanner ────────────────────────────────────────────────────────────────
let qrStream = null, qrInterval = null;

document.getElementById('qr-scan-btn').addEventListener('click', openQRScanner);
document.getElementById('qr-close').addEventListener('click', closeQRScanner);

async function openQRScanner() {
  document.getElementById('qr-modal').classList.add('show');
  document.getElementById('qr-result').classList.remove('show');

  try {
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const qrVideo  = document.getElementById('qr-video');
    const qrCanvas = document.getElementById('qr-canvas');
    const qrCtx    = qrCanvas.getContext('2d');
    qrVideo.srcObject = qrStream;

    qrInterval = setInterval(() => {
      if (qrVideo.readyState !== qrVideo.HAVE_ENOUGH_DATA) return;
      qrCanvas.width  = qrVideo.videoWidth;
      qrCanvas.height = qrVideo.videoHeight;
      qrCtx.drawImage(qrVideo, 0, 0);
      const img = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });

      if (code && code.data) {
        handleQRResult(code.data);
      }
    }, 200);
  } catch (e) {
    toast('Câmera não disponível para scanner');
    closeQRScanner();
  }
}

function handleQRResult(data) {
  // Expected format: "WIFICAM:ROOM_ID" or just the room ID
  let roomId = data;
  if (data.startsWith('WIFICAM:')) roomId = data.slice(8);

  clearInterval(qrInterval);
  const el = document.getElementById('qr-result');
  el.textContent = `✓ Sala detectada: ${roomId} — Conectando...`;
  el.classList.add('show');

  setTimeout(() => {
    closeQRScanner();
    window.location.href = `/viewer.html?room=${encodeURIComponent(roomId)}`;
  }, 1200);
}

function closeQRScanner() {
  clearInterval(qrInterval);
  if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
  document.getElementById('qr-modal').classList.remove('show');
}

// ── Init ──────────────────────────────────────────────────────────────────────
fetchCameras();
// Refresh every 15s to update "x min atrás"
setInterval(() => renderGrid(), 15000);
</script>
</body>
</html>
